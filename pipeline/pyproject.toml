[project]
name = "buried-pipeline"
version = "0.1.0"
description = "Buried pipeline: fetch plates, inspect georeferencing, clip present-day layers, measure alignment error."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rasterio>=1.4",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "jsonschema>=4.22",
    "httpx>=0.27",
]

[project.scripts]
buried = "buried_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["buried_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Long literal lines in test data (URLs, attribution text) are clearer unwrapped.
"tests/**" = ["E501"]
